<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暗影象棋 · Shadow Chess</title>
  <meta name="description" content="独创暗影规则国际象棋：棋子随机排列，身份隐藏，首步按位置规则移动，移动后揭示真实身份。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ░░ PASS SCREEN OVERLAY ░░ -->
  <div id="pass-screen" class="overlay">
    <div class="dialog-box pass-box">
      <div class="dialog-eye">👁️</div>
      <h2 id="pass-title" class="dialog-heading">轮到白方了</h2>
      <p id="pass-sub" class="dialog-sub">请将屏幕传递给对方，准备好后点击继续</p>
      <button id="btn-pass-ready" class="btn-primary">白方已准备好 →</button>
    </div>
  </div>

  <!-- ░░ PROMOTION DIALOG ░░ -->
  <div id="promo-dialog" class="overlay hidden">
    <div class="dialog-box">
      <div class="dialog-icon">♛</div>
      <h3 class="dialog-heading">兵的升变</h3>
      <p class="dialog-sub">选择此兵升变为哪种棋子</p>
      <div id="promo-choices" class="promo-choices"></div>
    </div>
  </div>

  <!-- ░░ GAME OVER DIALOG ░░ -->
  <div id="gameover-dialog" class="overlay hidden">
    <div class="dialog-box gameover-box">
      <div class="dialog-icon trophy-anim">🏆</div>
      <h2 class="dialog-heading">游戏结束</h2>
      <p id="gameover-msg" class="gameover-msg">白方获胜</p>
      <button id="btn-gameover-new" class="btn-primary">开始新游戏</button>
    </div>
  </div>

  <!-- ░░ MAIN GAME ░░ -->
  <div id="game">

    <!-- ── Board Area ── -->
    <div id="board-area">

      <!-- Top player bar -->
      <div id="player-top" class="player-bar">
        <div class="player-left">
          <div id="top-dot" class="color-dot black"></div>
          <span id="top-name" class="player-name">黑方</span>
          <span class="player-badge">🎭</span>
        </div>
        <div id="timer-top" class="timer">10:00</div>
      </div>

      <!-- Board + rank labels -->
      <div id="board-outer">
        <div id="coord-ranks" class="coord-col"></div>
        <div id="board"></div>
      </div>

      <!-- File labels -->
      <div id="coord-files" class="coord-row"></div>

      <!-- Bottom player bar -->
      <div id="player-bot" class="player-bar active">
        <div class="player-left">
          <div id="bot-dot" class="color-dot white"></div>
          <span id="bot-name" class="player-name">白方</span>
          <span class="player-badge">🎭</span>
        </div>
        <div id="timer-bot" class="timer">10:00</div>
      </div>

    </div><!-- /board-area -->

    <!-- ── Info Panel ── -->
    <div id="info-panel">

      <div id="panel-header">
        <h1 class="game-title">暗影象棋</h1>
        <p class="game-subtitle">Shadow Chess</p>
        <div class="title-divider"></div>
      </div>

      <!-- Status row -->
      <div id="status-row">
        <div id="turn-indicator" class="turn-indicator white-turn">
          <span class="turn-dot"></span>白方回合
        </div>
        <div id="check-indicator" class="check-badge hidden">⚠️ 将军！</div>
      </div>

      <!-- Controls -->
      <div id="controls">
        <button id="btn-new" class="btn-sec" title="开始新游戏">
          <span>⟳</span> 新游戏
        </button>
        <button id="btn-undo" class="btn-sec" title="悔棋">
          <span>↩</span> 悔棋
        </button>
      </div>

      <!-- Move history -->
      <div class="panel-section">
        <div class="section-title">📜 棋谱记录</div>
        <div id="move-list" class="move-list"></div>
      </div>

      <!-- Rules -->
      <div class="panel-section">
        <div class="section-title">📖 暗影规则</div>
        <div class="rules-list">
          <div class="rule-item">
            <span class="rule-icon">🎲</span>
            <span>双方棋子随机排列开局</span>
          </div>
          <div class="rule-item">
            <span class="rule-icon">🙈</span>
            <span>看不到对方的棋子身份</span>
          </div>
          <div class="rule-item">
            <span class="rule-icon">🔀</span>
            <span>首步按所在格子原始规则走棋</span>
          </div>
          <div class="rule-item">
            <span class="rule-icon">✨</span>
            <span>移动后棋子翻面，揭示真实身份</span>
          </div>
          <div class="rule-item">
            <span class="rule-icon">⚡</span>
            <span>将军时，给将棋子自动揭示</span>
          </div>
        </div>
      </div>

      <!-- Legend -->
      <div class="panel-section">
        <div class="section-title">🗺️ 图例</div>
        <div class="legend-list">
          <div class="legend-item">
            <div class="legend-swatch swatch-unrevealed">♕</div>
            <div class="legend-text">
              <div class="legend-label">己方未揭示</div>
              <div class="legend-desc">可见真实身份 · 首步按位置走</div>
            </div>
          </div>
          <div class="legend-item">
            <div class="legend-swatch swatch-hidden">?</div>
            <div class="legend-text">
              <div class="legend-label">对方棋子</div>
              <div class="legend-desc">身份未知 · 移动后揭示</div>
            </div>
          </div>
          <div class="legend-item">
            <div class="legend-swatch swatch-revealed">♖</div>
            <div class="legend-text">
              <div class="legend-label">已揭示棋子</div>
              <div class="legend-desc">身份公开 · 按真实类型走棋</div>
            </div>
          </div>
        </div>
      </div>

    </div><!-- /info-panel -->
  </div><!-- /game -->

  <script src="js/chess.js"></script>
  <script src="js/board.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
